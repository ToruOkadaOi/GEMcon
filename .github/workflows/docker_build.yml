name: Docker build + push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: gemcon:test
          load: true

      - name: Smoke test
        run: |
          docker run --rm gemcon:test gemcon --help

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag gemcon:test toluene123/gemcon:latest
          docker tag gemcon:test toluene123/gemcon:sha-${{ github.sha }}
          docker push toluene123/gemcon:latest
          docker push toluene123/gemcon:sha-${{ github.sha }}
