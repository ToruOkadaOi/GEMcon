## .loom or .h5ad input file (optional -- will prompt HCA download if not set)
#input_file: ./data/data_raw/HCA_downloads/your_file.loom

## celltype: leave empty to pool all cells or specify column name
celltype: ""

## gene annotation file (Gencode GTF). Download from https://www.gencodegenes.org/
gtf: ./data/data_raw/gencode.v49.annotation.gtf

## metabolic model path (currently tested with Human-GEM)
model: ./Human-GEM/model/Human-GEM.xml
# model: ./Recon3D.xml

# config for Human-GEM
model_config:
  objective_reaction: "MAR02388"
  alt_transcript_pattern: '__COBAMPGPRDOT__[0-9]{1}'

## config for Recon3D (uncomment and replace above model_config to use)
# model_config:
#   alt_transcript_pattern: '_AT[0-9]+$'
#   objective_reaction: 'ATPM'

## gimme config
gimme:
  obj_frac: 0.1
  flux_threshold: 0.25
  solver: "CPLEX"

## tinit config
tinit:
  solver: "CPLEX"
  essential_reactions:
    - "MAR13082"
  nomenclature: "ensembl_gene_id"

## save dir for extracted model
output:
  models_dir: ./models

## riptide config (Jenior et al., 2020 - PLOS Comp Biol)
riptide:
  mode: "contextualize"
  fraction: 0.8
  samples: 500
  prune: true
  conservative: false
  objective: true
  additive: false
  set_bounds: true
  gpr: false
  threshold: 1.0e-8
  tasks: []
  exclude: []
  frac_min: 0.25
  frac_max: 0.85
  frac_step: 0.1

## corda config (Schultz et al. 2016)
corda:
  quantile_absent: 0.05
  quantile_unknown: 0.25
  quantile_low: 0.50
  quantile_medium: 0.75
  met_prod: []

## geckopy config
geckopy:
  ec_model: "./data/ecHumanGEM_expanded.xml"
  paxdb_data: "./data/data_raw/paxdb_human_data/9606-WHOLE_ORGANISM-integrated.txt"
  cell_params:
    vol: 2.3e-12
    dens: 1.05
    water: 0.7
  solver: "CPLEX"
