## .loom or .h5ad
#input_file: /home/biodata/aman/data/data_raw/HCA_downloads/t-cell-activation-human-blood-10XV2.loom

##celltype: leave empty to pool all cells or specify column name
celltype: "" 

## gene annotation file. obtained from Gencode usually. ### TODO: utility script for dwld
gtf: /home/biodata/aman/data/data_raw/gencode.v49.annotation.gtf

# currently tested with Human-GEM only
model: /home/biodata/aman/Human-GEM/model/Human-GEM.xml
# model: /home/biodata/Recon3D.xml

# config for Human-GEM
model_config:
  objective_reaction: "MAR02388" # this points to biomass
  alt_transcript_pattern: '__COBAMPGPRDOT__[0-9]{1}'

## config for recon3D
# model_config:
#   alt_transcript_pattern: '_AT[0-9]+$'  # Recon3D pattern
#   objective_reaction: 'ATPM'  # Recon3D objective

## gimme config
gimme:
  obj_frac: 0.1
  flux_threshold: 0.25
  solver: "CPLEX"

## tinit config
tinit:
  solver: "CPLEX"
  essential_reactions:
    - "MAR13082" 
  nomenclature: "ensembl_gene_id" 
  
## for ref. others are ## NOMENCLATURES: [“hgnc_id”,”symbol”,”name”,”entrez_id”,”ensembl_gene_id”,”vega_id”,”ucsc_id”,”ccds_id”, “uniprot_ids”,“pubmed_id”,”omim_id”,”locus_group”,”locus_type”,”alias_symbol”,”alias_name”, “prev_symbol”,”prev_name”, “ena”,”refseq_accession”,”rna_central_ids”] # troppo docs

## save dir for extracted model
output:
  models_dir: ./models

## corda config (Schultz et al. 2016 - works with free GLPK solver!)
## Install: pip install corda (from https://github.com/resendislab/corda)
## Uses 5 confidence levels: -1 (absent), 0 (unknown), 1 (low), 2 (medium), 3 (high)
corda:
  # Quantile-based thresholds for expression to confidence mapping
  # Default: 5%, 25%, 50%, 75% percentiles
  quantile_absent: 0.05    # expression below this -> confidence -1
  quantile_unknown: 0.25   # expression below this -> confidence 0
  quantile_low: 0.50       # expression below this -> confidence 1
  quantile_medium: 0.75    # expression below this -> confidence 2, above -> confidence 3
  # Or use absolute thresholds (override quantiles if set)
  # threshold_absent: null
  # threshold_unknown: null
  # threshold_low: null
  # threshold_medium: null
  # Metabolites that must be producible (optional)
  met_prod: []

geckopy:
  ec_model: "/home/biodata/aman/data/ecHumanGEM_expanded.xml"
  paxdb_data: "/home/biodata/aman/data/data_raw/paxdb_human_data/9606-WHOLE_ORGANISM-integrated.txt"
  cell_params:
    vol: 2.3e-12
    dens: 1.05
    water: 0.7
  solver: "CPLEX"